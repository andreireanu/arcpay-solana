[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
arcpay_solana = "6KELPQtzV7uchqQC2xEAL7u2BR2Hh5cP57YYUgRpnsed"

# Load the program at genesis with the provider wallet as upgrade authority —
# required since initialize_config verifies the caller against
# ProgramData.upgrade_authority_address.
[[test.genesis]]
address = "6KELPQtzV7uchqQC2xEAL7u2BR2Hh5cP57YYUgRpnsed"
program = "target/deploy/arcpay_solana.so"
upgradeable = true

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/owner.json"

[scripts]
deregister = "npx ts-node scripts/deregister.ts"
initialize = "npx ts-node scripts/initialize.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
withdraw = "npx ts-node scripts/withdraw_commission.ts"
